[project]
name = "annex"
version = "0.1.0"
description = "An agent over the EU AI Act that reports which articles apply, cited to the text"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "lxml>=5.3",
    "openai>=1.60",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlite-vec>=0.1.6",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annex"]
