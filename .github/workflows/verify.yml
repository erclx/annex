name: Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  static-checks:
    name: 🛡️ Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Shell Tools
        run: sudo apt-get install -y shfmt shellcheck

      - name: Check Formatting
        run: bun run check:format

      - name: Check Spelling
        run: bun run check:spell

      - name: Check Shell
        run: bun run check:shell

  python-checks:
    name: 🐍 Python Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: cd python && uv sync --frozen

      - name: Typecheck, Lint and Test
        run: bun run check:python

  web-checks:
    name: 🌐 Web Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Shell Tools
        run: sudo apt-get install -y shfmt

      - name: Install Dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Typecheck, Lint and Test
        run: bun run check:web

  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Read Playwright Version
        id: playwright-version
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' web/package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        run: cd web && bunx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: cd web && bun run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
