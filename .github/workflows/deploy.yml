name: Deploy

# The deployed page is a recording. The model this project runs holds 30 GB of
# a card and nothing hosted answers these questions, so the build that ships is
# the static export of `web/` in replay mode, serving the answers
# `uv run python -m annex capture` took from the live system.
#
# Direct Upload, so Cloudflare never runs a build and no root directory is
# configured outside this tree. The pattern is the one
# `/home/erclx/repos/private/career/public/erclx.dev` records, with one
# departure: that repository's verify workflow builds the artifact its deploy
# uploads, and `verify.yml` here has no build job and no push trigger, so the
# gate and the build sit in this file instead.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-checks:
    name: 🌐 Web Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Shell Tools
        run: sudo apt-get install -y shfmt

      - name: Install Dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Typecheck, Lint and Test
        run: bun run check:web

  build:
    name: 📦 Static Export
    runs-on: ubuntu-latest
    needs: web-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: cd web && bun install --frozen-lockfile

      # The flag decides both halves of what ships: `ask` answers from the
      # fixtures rather than the service, and `next.config.ts` turns the build
      # into a static export. A build without it would deploy a page calling a
      # localhost service nobody is running.
      - name: Build
        run: cd web && bun run build
        env:
          NEXT_PUBLIC_ANNEX_MODE: replay

      - name: Upload the export
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out
          retention-days: 7

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    # Lifted to the job so the upload step's own `if` can read them. A job-level
    # conditional cannot reach the secrets context at all, and a step-level
    # `env` is not guaranteed to be in scope for that step's `if`.
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # Not for the source, which this job never builds, but because
      # `wrangler-action` resolves its package manager against the working
      # directory and an empty workspace gives it nothing to read.
      - name: Checkout
        uses: actions/checkout@v4

      # This job builds nothing and still needs a toolchain. The checkout above
      # brings `bun.lock`, `wrangler-action` reads it, picks bun on the strength
      # of it, and installs wrangler with that, so a deploy with no bun on PATH
      # fails before it reaches Cloudflare. Dropping these as dead weight is what
      # broke the deploy on every push in the repository this pattern came from.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download the export
        uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/out

      # The ref supplies the branch, so only a run on `main` marks its upload
      # as a production deployment. A dispatch from any other ref exercises the
      # whole job and lands on a preview host instead.
      #
      # Skipped rather than failed while the token is unset. Creating the Pages
      # project and attaching the domain are the operator's, so without this the
      # first merge puts a red Deploy run on the trunk and every push keeps it
      # there until those two acts are done.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          command: pages deploy web/out --project-name=annex --branch=${{ github.ref_name }}

      # A skipped step reads as a green job and says nothing, so the run says
      # what it did not do and what would make it upload.
      - name: Report the skipped upload
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::The export built and was not uploaded. CLOUDFLARE_API_TOKEN is unset, so the Pages project is not reachable yet. Create the project, attach annex.erclx.dev, and add both repository secrets."
